<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Gun 32X - Dev Log</title>
    <style>
        body { font-family: monospace; background: #121212; color: #00ffcc; max-width: 820px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
        h1 { color: #ffaa00; border-bottom: 2px solid #333; padding-bottom: 10px; text-shadow: 0 0 8px rgba(255,170,0,0.3); }
        .entry { background: #1b1b1b; padding: 22px; border-radius: 8px; margin-bottom: 28px; border: 1px solid #333; box-sizing: border-box; width: 100%; }
        .entry h2 { color: #fff; margin-top: 0; }
        .date { color: #888; font-size: 0.9em; margin-bottom: 14px; }
        .entry p { margin: 0 0 14px 0; word-break: break-word; color: #d0d0d0; }
        .preview-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 100%; margin: 18px 0; box-sizing: border-box; }
        .preview-card { display: block; background: #0f0f0f; border: 1px solid #3a3a3a; border-radius: 6px; overflow: hidden; aspect-ratio: 4 / 3; text-decoration: none; }
        .preview-card:hover { border-color: #00ffcc; }
        .preview-card img { width: 100%; height: 100%; object-fit: contain; display: block; image-rendering: pixelated; }
        .donate-box { text-align: center; margin: 30px 0; padding: 15px; background: #181818; border: 1px dashed #444; border-radius: 6px; }
        .donate-btn { background: #ff5e5b; color: #ffffff; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 6px; font-family: sans-serif; display: inline-block; }
    </style>
</head>
<body>
    <h1>Space Gun 32X Devlog</h1>
    <div class="donate-box">
        <a class="donate-btn" href="https://ko-fi.com/" target="_blank">☕ Support the 32X Port</a>
    </div>

    <!-- POSTS_CONTAINER -->
</body>
</html>
